<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Check Point MCP servers on Amazon EKS: consumers (the chkpmcpeks CLI, any MCP client, Teams, n8n, curl, Postman) reach one Application Load Balancer with ACM TLS; it routes /mcp to agentgateway and /v1/chat to the security-ops agent. Both validate Amazon Cognito client-credentials JWTs. agentgateway aggregates one Deployment per @chkp MCP server under one authenticated MCP endpoint, forwards only allow-listed headers and enforces a read-only tool policy. The agent calls Amazon Bedrock through EKS Pod Identity. External Secrets Operator syncs the shared chkp/server secrets from AWS Secrets Manager; images come from Amazon ECR by digest; CloudWatch Container Insights collects metrics and logs; servers reach the Check Point estate over HTTPS through one NAT egress IP.">
  <defs>
    <linearGradient id="cp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#a02bce"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b90a8"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0117f"/>
    </marker>
    <style>
      .p{fill:#1c2036} .m{fill:#565d78} .f{fill:#8489a0}
      .t{font-weight:700} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .zone{fill:#f7f8fd;stroke:#e2e5f1}
      .cluster{fill:#eef0f9;stroke:#cfd4e6;stroke-dasharray:6 4}
      .node{fill:#ffffff;stroke:#d9ddeb}
      .agent{fill:#fdf4fa;stroke:url(#cp)}
      .proven{fill:#fdf4fa;stroke:#e0117f}
      .edge{stroke:#8b90a8;stroke-width:2;fill:none}
      .edgeA{stroke:#e0117f;stroke-width:2.5;fill:none}
      .pill{fill:#ffffff;stroke:#d9ddeb}
    </style>
  </defs>

  <rect x="1" y="1" width="1418" height="878" rx="18" fill="#ffffff" stroke="#e2e5f1" stroke-width="1.5"/>

  <!-- title -->
  <rect x="40" y="32" width="6" height="30" rx="3" fill="url(#cp)"/>
  <text x="58" y="47" class="p t" font-size="21">Check Point MCP on Amazon EKS</text>
  <text x="58" y="70" class="m" font-size="14">15 <tspan class="mono">@chkp</tspan> MCP servers  ·  one authenticated gateway  ·  an agent you can call from anywhere  ·  all on Kubernetes</text>

  <!-- ===================== zone labels + AWS panel ===================== -->
  <text x="60"   y="150" class="f t" font-size="12" letter-spacing="1.5">CONSUMERS</text>
  <rect x="320" y="164" width="830" height="690" rx="14" class="zone"/>
  <text x="344"  y="150" class="f t" font-size="12" letter-spacing="1.5">AWS  ·  AMAZON EKS AUTO MODE  (us-east-1)</text>
  <text x="1190" y="150" class="f t" font-size="12" letter-spacing="1.5">CHECK POINT ESTATE</text>

  <!-- ===================== consumer column ===================== -->
  <rect x="40" y="190" width="240" height="96" rx="10" class="agent" stroke-width="2"/>
  <text x="56" y="216" class="p t" font-size="13.5">chkpmcpeks CLI</text>
  <text x="56" y="234" class="m" font-size="11.5">deploy · status · chat · destroy</text>
  <text x="56" y="250" class="m" font-size="11.5">streams the agent's answer</text>
  <text x="56" y="268" class="f" font-size="10.5">Cognito client-credentials token</text>

  <rect x="40" y="310" width="240" height="66" rx="10" class="node"/>
  <text x="56" y="336" class="p t" font-size="13">Any MCP client</text>
  <text x="56" y="355" class="f" font-size="11">Claude Desktop · IDE · n8n · /mcp</text>

  <rect x="40" y="400" width="240" height="66" rx="10" class="node"/>
  <text x="56" y="426" class="p t" font-size="13">Teams · n8n · curl · Postman</text>
  <text x="56" y="445" class="f" font-size="11">POST /v1/chat · JSON or SSE stream</text>

  <rect x="40" y="490" width="240" height="66" rx="10" class="node" stroke-dasharray="5 3"/>
  <text x="56" y="516" class="p t" font-size="13">Argo CD · Flux <tspan class="f" font-weight="400" font-size="10">(optional)</tspan></text>
  <text x="56" y="535" class="f" font-size="11">same Helm chart, GitOps-managed</text>

  <!-- ===================== cognito + ALB (outside the cluster) ===================== -->
  <rect x="345" y="190" width="170" height="64" rx="10" class="node"/>
  <text x="361" y="216" class="p t" font-size="13">Amazon Cognito</text>
  <text x="361" y="236" class="m" font-size="11">M2M JWT · scope invoke</text>

  <rect x="345" y="292" width="170" height="124" rx="10" class="node"/>
  <text x="361" y="318" class="p t" font-size="13">Application</text>
  <text x="361" y="335" class="p t" font-size="13">Load Balancer</text>
  <text x="361" y="356" class="m" font-size="11">Auto Mode · ACM TLS</text>
  <text x="361" y="378" class="f mono" font-size="10.5">/mcp  → gateway</text>
  <text x="361" y="394" class="f mono" font-size="10.5">/v1   → agent</text>

  <!-- consumer edges -> ALB -->
  <path d="M280 238 C 310 250, 320 300, 345 322" class="edgeA" marker-end="url(#am)"/>
  <path d="M280 343 C 305 343, 320 345, 345 350" class="edge" marker-end="url(#a)"/>
  <path d="M280 433 C 310 430, 320 400, 345 386" class="edge" marker-end="url(#a)"/>
  <path d="M280 523 C 300 600, 360 640, 545 600" class="edge" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="382" y="640" class="f" font-size="9.5">helm upgrade</text>

  <!-- ===================== EKS cluster panel ===================== -->
  <rect x="545" y="184" width="585" height="460" rx="12" class="cluster"/>
  <text x="565" y="206" class="f t" font-size="11" letter-spacing="1.2">EKS CLUSTER  ·  namespace <tspan class="mono" letter-spacing="0">chkp-mcp</tspan>  ·  Graviton (arm64)</text>

  <!-- gateway (hub) -->
  <rect x="570" y="226" width="220" height="234" rx="14" class="agent" stroke-width="2.5"/>
  <path d="M570 260 V240 q0-14 14-14 h192 q14 0 14 14 v20 z" fill="url(#cp)"/>
  <text x="588" y="248" fill="#fff" font-size="12.5" class="t">agentgateway</text>
  <text x="588" y="286" class="m" font-size="11.5">one authenticated</text>
  <text x="588" y="302" class="m" font-size="11.5">MCP endpoint</text>
  <text x="588" y="326" class="m" font-size="11.5">every server's tools,</text>
  <text x="588" y="342" class="f mono" font-size="10">&lt;server&gt;_&lt;tool&gt;</text>
  <text x="588" y="370" class="f" font-size="10">Cognito JWT · client + scope CEL</text>
  <text x="588" y="386" class="f" font-size="10">read-only tool policy</text>
  <text x="588" y="402" class="f" font-size="10">header allow-list</text>
  <text x="588" y="418" class="f" font-size="10">stateless · fail-open per server</text>
  <text x="588" y="442" class="f" font-size="9.5">OTel · Prometheus metrics</text>

  <!-- ALB -> gateway -->
  <path d="M515 334 L570 334" class="edgeA" marker-end="url(#am)"/>
  <!-- cognito -> gateway (JWKS) -->
  <path d="M515 222 C 540 226, 552 236, 570 250" class="edge" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="519" y="272" class="f" font-size="9">JWKS</text>

  <!-- agent -->
  <rect x="570" y="500" width="240" height="118" rx="12" class="agent" stroke-width="2.5"/>
  <text x="588" y="527" class="p t" font-size="14">Security-Ops Agent</text>
  <text x="588" y="547" class="m" font-size="11.5">Deployment <tspan class="mono" font-size="10.5">chkp-agent</tspan> · /v1/chat</text>
  <text x="588" y="565" class="m" font-size="11.5">Bedrock · Azure OpenAI · OpenAI</text>
  <text x="588" y="583" class="f" font-size="10.5">prompt caching · SSE · telemetry</text>
  <text x="588" y="601" class="f" font-size="10.5">validates the same Cognito JWT</text>

  <!-- ALB -> agent -->
  <path d="M515 392 C 535 440, 545 520, 570 540" class="edge" marker-end="url(#a)"/>
  <!-- agent -> gateway -->
  <path d="M700 500 L700 460" class="edgeA" marker-end="url(#am)"/>
  <text x="710" y="485" class="p" font-size="10">MCP · JWT</text>

  <!-- servers (one Deployment per server) -->
  <text x="870" y="230" class="f" font-size="11">one Deployment per <tspan class="mono">@chkp</tspan> server</text>
  <g class="mono" font-size="11.5">
    <rect x="870" y="242" width="230" height="38" rx="8" class="node"/>
    <text x="886" y="266" class="p">quantum-management</text>
    <rect x="870" y="288" width="230" height="38" rx="8" class="node"/>
    <text x="886" y="312" class="p">threat-prevention</text>
    <rect x="870" y="334" width="230" height="38" rx="8" class="proven" stroke-width="1.5"/>
    <text x="886" y="358" class="p">reputation-service</text>
    <rect x="870" y="380" width="230" height="38" rx="8" class="node"/>
    <text x="886" y="404" class="p">documentation</text>
    <rect x="870" y="426" width="230" height="38" rx="8" fill="#f7f8fd" stroke="#c9cede" stroke-dasharray="4 3"/>
    <text x="886" y="450" class="m" font-size="11">+ 11 more · 15 total</text>
  </g>
  <text x="870" y="484" class="f" font-size="10">9 by default · non-root · read-only rootfs</text>
  <text x="870" y="499" class="f" font-size="10">NetworkPolicy: only the gateway gets in</text>

  <!-- gateway -> servers -->
  <path d="M790 353 L870 353" class="edgeA" marker-end="url(#am)"/>
  <text x="830" y="342" class="f" font-size="9" text-anchor="middle">allow-listed</text>
  <text x="830" y="372" class="f" font-size="9" text-anchor="middle">headers only</text>

  <!-- ESO + Reloader -->
  <rect x="870" y="540" width="230" height="70" rx="10" class="node"/>
  <text x="886" y="564" class="p t" font-size="12.5">External Secrets + Reloader</text>
  <text x="886" y="582" class="f" font-size="10"><tspan class="mono">chkp/&lt;server&gt;</tspan> → env vars</text>
  <text x="886" y="597" class="f" font-size="10">restart on rotation · re-sync 1 min</text>
  <!-- ESO -> servers -->
  <path d="M985 540 L985 508" class="edge" marker-end="url(#a)"/>

  <!-- ===================== AWS services row ===================== -->
  <rect x="345" y="690" width="185" height="72" rx="10" class="node"/>
  <text x="361" y="715" class="p t" font-size="12.5">Amazon Bedrock</text>
  <text x="361" y="733" class="f" font-size="10.5">Converse · Claude or Nova</text>
  <text x="361" y="749" class="f" font-size="10.5">invoke only · no AgentCore</text>

  <rect x="550" y="690" width="185" height="72" rx="10" class="node"/>
  <text x="566" y="715" class="p t" font-size="12.5">AWS Secrets Manager</text>
  <text x="566" y="733" class="f mono" font-size="10">chkp/&lt;server&gt;</text>
  <text x="566" y="749" class="f" font-size="10.5">shared with AgentCore</text>

  <rect x="755" y="690" width="185" height="72" rx="10" class="node"/>
  <text x="771" y="715" class="p t" font-size="12.5">Amazon ECR</text>
  <text x="771" y="733" class="f" font-size="10.5">images pinned by digest</text>
  <text x="771" y="749" class="f" font-size="10.5">built on CodeBuild (arm64)</text>

  <rect x="960" y="690" width="170" height="72" rx="10" class="node"/>
  <text x="976" y="715" class="p t" font-size="12.5">CloudWatch</text>
  <text x="976" y="733" class="f" font-size="10.5">Container Insights</text>
  <text x="976" y="749" class="f" font-size="10.5">JSON logs · metrics</text>

  <!-- agent -> bedrock -->
  <path d="M600 618 C 590 650, 480 660, 450 690" class="edge" marker-end="url(#a)"/>
  <text x="362" y="680" class="f" font-size="9.5">Pod Identity</text>
  <!-- secrets manager -> ESO -->
  <path d="M700 690 C 720 650, 830 600, 870 590" class="edge" marker-end="url(#a)"/>
  <text x="772" y="666" class="f" font-size="9.5">read-only role</text>
  <!-- ECR -> cluster -->
  <path d="M900 690 L900 644" class="edge" stroke-dasharray="2 4" marker-end="url(#a)"/>
  <!-- cluster -> CloudWatch -->
  <path d="M1060 644 L1060 690" class="edge" stroke-dasharray="2 4" marker-end="url(#a)"/>

  <!-- footer inside the AWS panel -->
  <text x="345" y="800" class="m t" font-size="11">Terraform</text>
  <text x="410" y="800" class="f" font-size="11">VPC with private subnets and one NAT  ·  EKS Auto Mode  ·  Cognito  ·  Pod Identity roles  ·  ACM</text>
  <text x="345" y="822" class="m t" font-size="11">Helm</text>
  <text x="410" y="822" class="f" font-size="11">one chart from the server catalog  ·  default-deny NetworkPolicies  ·  HPA · PDB  ·  restricted pods</text>

  <!-- ===================== check point estate ===================== -->
  <rect x="1190" y="290" width="200" height="240" rx="12" class="node"/>
  <text x="1212" y="324" class="p t" font-size="15">Check Point estate</text>
  <text x="1212" y="356" class="m" font-size="12.5">Management server</text>
  <text x="1212" y="378" class="m" font-size="12.5">Smart-1 Cloud</text>
  <text x="1212" y="400" class="m" font-size="12.5">ThreatCloud</text>
  <text x="1212" y="422" class="m" font-size="12.5">Infinity Portal</text>
  <text x="1212" y="458" class="f" font-size="11.5">your real security data</text>
  <text x="1212" y="488" class="f" font-size="10">reached over HTTPS from</text>
  <text x="1212" y="503" class="f" font-size="10">one NAT egress IP to allow-list</text>

  <!-- servers -> estate -->
  <path d="M1100 399 L1190 399" class="edge" marker-end="url(#a)"/>

  <!-- ===================== legend ===================== -->
  <text x="1190" y="606" class="f t" font-size="12" letter-spacing="1.5">LEGEND</text>
  <path d="M1192 632 L1232 632" class="edgeA" marker-end="url(#am)"/>
  <text x="1244" y="636" class="m" font-size="11">request path</text>
  <path d="M1192 658 L1232 658" class="edge" marker-end="url(#a)"/>
  <text x="1244" y="662" class="m" font-size="11">data · credentials</text>
  <path d="M1192 684 L1232 684" class="edge" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="1244" y="688" class="m" font-size="11">auth keys · deploy</text>
  <path d="M1192 710 L1232 710" class="edge" stroke-dasharray="2 4" marker-end="url(#a)"/>
  <text x="1244" y="714" class="m" font-size="11">images · telemetry</text>
  <rect x="1192" y="728" width="40" height="20" rx="5" class="proven" stroke-width="1.5"/>
  <text x="1244" y="742" class="m" font-size="11">verified end to end</text>
</svg>
