{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- /*
Zero-trust inside the namespace: deny everything, then allow exactly
  ALB subnets     -> agentgateway :3000/:15021, agent :8080
  agent           -> agentgateway :3000, Bedrock/Cognito :443, Pod Identity agent
  agentgateway    -> MCP servers :8000, Cognito JWKS :443
  MCP servers     -> serverDefaults.egress (default :443 anywhere) -- nothing else,
                     and nothing but agentgateway may reach them
EKS Auto Mode enforces these only once its network policy controller is
enabled (the amazon-vpc-cni ConfigMap in deploy/platform.yaml).
*/ -}}
{{- $albSources := $np.albCidrs | default (list $np.vpcCidr) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chkp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
        {{- range $np.dnsCidrs }}
        - ipBlock: {cidr: {{ . }}}                 # Auto Mode: DNS runs on the node itself
        {{- end }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: mcp-server}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agentgateway}
      ports:
        - {protocol: TCP, port: {{ $.Values.serverDefaults.port }}}
  egress:
    - to:
        {{- range .Values.serverDefaults.egress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
            except: ["169.254.169.254/32"]   # never the instance metadata service
        {{- end }}
      ports:
        {{- range .Values.serverDefaults.egress.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agentgateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range $albSources }}
        - ipBlock: {cidr: {{ . }}}                 # the ALB and its health checks
        {{- end }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: chkp-agent}
      ports:
        - {protocol: TCP, port: {{ $.Values.agentgateway.port }}}
        - {protocol: TCP, port: {{ $.Values.agentgateway.readinessPort }}}
    {{- with $np.metricsFromNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $.Values.agentgateway.metricsPort }}}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: mcp-server}
        {{- with $np.serviceCidr }}
        - ipBlock: {cidr: {{ . }}}                 # Service ClusterIPs (pre-DNAT); servers' ingress still admits only the gateway
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $.Values.serverDefaults.port }}}
    - to:                                            # Cognito JWKS, OTLP collector
        - ipBlock: {cidr: 0.0.0.0/0, except: ["169.254.169.254/32"]}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 4317}
{{- if .Values.agent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chkp-agent
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: chkp-agent}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range $albSources }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $.Values.agent.port }}}
    {{- with $np.metricsFromNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $.Values.agent.port }}}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agentgateway}
        {{- with $np.serviceCidr }}
        - ipBlock: {cidr: {{ . }}}                 # the gateway's Service ClusterIP
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $.Values.agentgateway.port }}}
    - to:                                            # EKS Pod Identity agent (link-local)
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:                                            # Bedrock, Cognito, Azure/OpenAI APIs
        - ipBlock: {cidr: 0.0.0.0/0, except: ["169.254.169.254/32"]}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
{{- end }}
