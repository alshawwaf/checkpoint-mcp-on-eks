{{- /*
Namespaced SecretStore: only ExternalSecrets in this namespace can use it. It
authenticates with the External Secrets Operator controller's own EKS Pod
Identity (no auth block), which Terraform scopes to read-only access on
`<secrets.prefix>*` and this stack's own secrets.
*/ -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secrets.storeName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chkp.labels" . | nindent 4 }}
spec:
  provider:
    {{- toYaml .Values.secrets.provider | nindent 4 }}
