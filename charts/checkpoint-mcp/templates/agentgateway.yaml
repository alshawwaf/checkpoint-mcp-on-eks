{{- /*
agentgateway (standalone mode): one Deployment + ConfigMap, no CRDs, no control
plane. Aggregates every enabled server under one authenticated streamable-HTTP
endpoint at /mcp, tools named <target>_<tool>.
*/ -}}
{{- $g := .Values.agentgateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chkp.labels" . | nindent 4 }}
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: {{ $g.image.tag | quote }}
spec:
  {{- if not $g.autoscaling.enabled }}
  replicas: {{ $g.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentgateway
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/agentgateway-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "chkp.podSecurity" . | nindent 8 }}
        runAsUser: 10101
        runAsGroup: 10101
      {{- include "chkp.scheduling" . | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
      containers:
        - name: agentgateway
          image: {{ include "chkp.image" (dict "repository" $g.image.repository "digest" $g.image.digest "tag" $g.image.tag) }}
          imagePullPolicy: IfNotPresent
          args: ["-f", "/etc/agentgateway/config.yaml"]
          ports:
            - {name: http, containerPort: {{ $g.port }}}
            - {name: metrics, containerPort: {{ $g.metricsPort }}}
            - {name: readiness, containerPort: {{ $g.readinessPort }}}
          readinessProbe:
            httpGet: {path: /healthz/ready, port: readiness}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            {{- include "chkp.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/agentgateway, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: agentgateway-config
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chkp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    # ALB health check against agentgateway's readiness endpoint.
    alb.ingress.kubernetes.io/healthcheck-port: {{ $g.readinessPort | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentgateway
  ports:
    - {name: http, port: {{ $g.port }}, targetPort: http}
    - {name: metrics, port: {{ $g.metricsPort }}, targetPort: metrics}
{{- if $g.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agentgateway}
  minReplicas: {{ $g.autoscaling.minReplicas }}
  maxReplicas: {{ $g.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $g.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
