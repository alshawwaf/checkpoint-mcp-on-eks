# Default values for checkpoint-mcp.
#
# `chkpmcpeks deploy` layers two generated files on top of this one:
#   values-images.yaml     image registry + per-image digests (from `chkpmcpeks build`)
#   values-generated.yaml  Terraform outputs (Cognito issuer/clients, ACM cert, VPC CIDR, ...)
# Everything here can also be set directly for a GitOps (Argo CD / Flux) install.

# Region of the Secrets Manager secrets and Bedrock.
region: us-east-1

# Every workload runs on the Graviton NodePool (images are built for arm64).
nodeSelector:
  kubernetes.io/arch: arm64
tolerations: []

# --------------------------------------------------------------------------- images
images:
  # Filled by values-images.yaml. Images are referenced by digest when known.
  registry: ""
  serverRepository: chkp-mcp-eks/mcp-server
  agentRepository: chkp-mcp-eks/agent
  servers: {}        # <server>: {tag: <server>-<version>, digest: sha256:...}
  agent: {}          # {tag: agent-<sha>, digest: sha256:...}
  pullPolicy: IfNotPresent

# --------------------------------------------------------------------------- Check Point MCP servers
# Mirrors chkpmcpeks/config.py SERVER_CATALOG (CI fails if they drift).
# creds: true  -> an ExternalSecret syncs Secrets Manager <secrets.prefix><server>
#                 into the pod as environment variables.
servers:
  quantum-management: {enabled: true, version: "1.4.7", creds: true}
  management-logs:    {enabled: true, version: "1.4.6", creds: true}
  threat-prevention:  {enabled: true, version: "1.5.4", creds: true}
  https-inspection:   {enabled: true, version: "1.4.6", creds: true}
  policy-insights:    {enabled: true, version: "0.3.5", creds: true}
  quantum-gw-cli:     {enabled: true, version: "1.4.8", creds: true}
  reputation-service: {enabled: true, version: "1.3.1", creds: true}
  threat-emulation:   {enabled: true, version: "1.3.1", creds: true}
  documentation:      {enabled: true, version: "1.4.6", creds: true, args: "--region US"}
  cloudguard-waf:     {enabled: false, version: "0.1.0", creds: true}
  spark-management:   {enabled: false, version: "1.4.8", creds: true}
  argos-erm:          {enabled: false, version: "0.5.4", creds: true}
  harmony-sase:       {enabled: false, version: "1.3.1", creds: true}
  workforce-ai:       {enabled: false, version: "1.1.0", creds: true}
  quantum-gaia:       {enabled: false, version: "1.3.5", creds: false}

serverDefaults:
  replicas: 1          # sessions live in process memory; scale only with care (see docs)
  port: 8000
  resources:
    requests: {cpu: 25m, memory: 96Mi}
    limits: {cpu: 500m, memory: 384Mi}   # a leak ends in an OOM restart, not node pressure
  # Egress a server may open (on-prem management, Smart-1 Cloud, ThreatCloud, Infinity Portal).
  egress:
    ports: [443]
    cidrs: ["0.0.0.0/0"]
  # Corporate egress proxy, if your network requires one.
  proxy:
    httpsProxy: ""
    noProxy: ""
  extraEnv: []

# --------------------------------------------------------------------------- Secrets (External Secrets Operator)
secrets:
  prefix: "chkp/"            # same secrets as the AgentCore project
  refreshInterval: 1m
  storeName: aws-secretsmanager
  # The store is a namespaced SecretStore that uses the ESO controller's EKS Pod
  # Identity (no auth block). Swap `provider` to use Vault, etc.
  provider:
    aws:
      service: SecretsManager
      region: us-east-1

# Restart a pod when its synced Secret changes (requires Stakater Reloader).
reloader:
  enabled: true

# --------------------------------------------------------------------------- Inbound auth (Cognito by default)
auth:
  issuer: ""                 # https://cognito-idp.<region>.amazonaws.com/<pool-id>
  jwksUrl: ""                # default: <issuer>/.well-known/jwks.json
  audience: ""               # Cognito M2M tokens carry no aud; set for Okta/Entra/Keycloak
  allowedClientIds: []       # Cognito app client ids allowed to call the gateway/agent
  requiredScope: chkp-mcp/invoke
  resourceUrl: ""            # public MCP URL advertised in OAuth protected-resource metadata

# --------------------------------------------------------------------------- Tool policy
toolPolicy:
  # Hide and deny tools whose names look mutating (add_/set_/delete_/publish/...).
  readOnly: true
  # Kept identical to chkpmcpeks/config.py MUTATING_TOOL_PATTERNS.
  mutatingPatterns: [add_, set_, delete_, remove_, update_, create_, edit_, publish, install_,
                     discard, approve, reject, submit, quarantine, restore, release, run_script,
                     execute, assign_, unlock, lock_, reset_, enable_, disable_]
  allowTools: []             # full tool names allowed even when readOnly (e.g. cloudguardwaf_publish)
  denyTools: []              # full tool names always denied

# --------------------------------------------------------------------------- MCP gateway (agentgateway)
agentgateway:
  image:
    repository: ghcr.io/agentgateway/agentgateway
    tag: v1.7.0
    digest: sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
  replicas: 2
  port: 3000
  metricsPort: 15020
  readinessPort: 15021
  prefixMode: always         # tools exposed as <server-without-hyphens>_<tool>
  statefulMode: stateless    # a fresh upstream session per request: no sticky sessions needed
  failureMode: failOpen      # one broken server must not take the whole catalog down
  sseKeepAlive: 25s          # keep long SSE streams alive behind the ALB
  # Only these request headers are forwarded to MCP servers. Everything else --
  # in particular the @chkp credential headers below -- is dropped.
  forwardHeaders: [accept, content-type, mcp-protocol-version, mcp-session-id, last-event-id,
                   mcp-method, mcp-name]
  # Defense in depth: explicitly removed even if forwardHeaders is widened.
  # Kept identical to chkpmcpeks/config.py CHKP_CREDENTIAL_HEADERS.
  denyHeaders: [api-key, argos-api-key, argos-customer-id, argos-host, argos-integration-token,
                argos-server-url, auth-url, client-id, cloud-connected, cloud-infra-token,
                cp-ci-access-key, cp-ci-client-id, cp-ci-gateway, dev-port, doc-source,
                doc-tool-client-id, doc-tool-region, doc-tool-secret-key, gateway-url,
                infinity-portal-url, management-domain, management-host, management-port, origin,
                password, region, s1c-url, secret-key, username, verbose, waf-access-key,
                waf-allow-writes, waf-client-id, waf-region, x-chkp-sid]
  logFormat: json
  tracing:
    otlpEndpoint: ""         # e.g. http://otel-collector.observability:4317
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# --------------------------------------------------------------------------- Security-ops agent
agent:
  enabled: true
  replicas: 2
  port: 8080
  serviceAccountName: chkp-agent     # bound to the Bedrock role by EKS Pod Identity
  llm:
    provider: bedrock                # bedrock | anthropic | azure | openai
    model: ""                        # empty = Bedrock auto-select (Claude preferred, Nova fallback); claude-opus-5-5 on anthropic
    effort: medium                   # anthropic only: low | medium | high | xhigh | max
    anthropicBaseUrl: ""             # anthropic only: an LLM gateway/proxy in front of the Anthropic API (disables server-side fallbacks)
    azureEndpoint: ""
    azureApiVersion: "2024-10-21"
    openaiBaseUrl: ""
  maxTurns: 12
  maxTokens: 2048
  gatewayTokenUrl: ""                # Cognito /oauth2/token
  clientSecretName: chkp-mcp-eks/agent-gateway-client   # GATEWAY_CLIENT_ID / GATEWAY_CLIENT_SECRET
  llmSecretName: chkp-mcp-eks/llm                       # ANTHROPIC_API_KEY / OPENAI_API_KEY / AZURE_OPENAI_API_KEY
  logLevel: INFO
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: "1", memory: 768Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# --------------------------------------------------------------------------- Ingress (EKS Auto Mode ALB)
ingress:
  enabled: true
  className: chkp-mcp-alb
  scheme: internet-facing
  certificateArn: ""
  inboundCidrs: ["0.0.0.0/0"]
  host: ""                           # set with a real domain; empty = match any host
  idleTimeoutSeconds: 300            # long tool calls and SSE streams
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

# --------------------------------------------------------------------------- NetworkPolicy
networkPolicy:
  enabled: true
  vpcCidr: "10.40.0.0/16"            # fallback source for ALB traffic when albCidrs is empty
  albCidrs: []                       # ALB (public) subnet CIDRs -- set by `chkpmcpeks deploy`
  dnsCidrs: []                       # node-local DNS on EKS Auto Mode: <service CIDR>.10/32 -- set by deploy
  # Service CIDR. EKS's policy agent sees ClusterIP destinations before DNAT, so
  # pod-selector egress rules also need this range on the same port -- set by deploy.
  serviceCidr: ""
  # Namespaces allowed to scrape metrics (Prometheus / CloudWatch agent).
  metricsFromNamespaces: [amazon-cloudwatch, monitoring]

# Optional PodMonitors for prometheus-operator users.
podMonitors:
  enabled: false
