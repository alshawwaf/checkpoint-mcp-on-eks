# Flux: the chart from this repository at a pinned tag, values from ConfigMaps
# you generate from values-images.yaml / values-generated.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: checkpoint-mcp-on-eks
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/alshawwaf/checkpoint-mcp-on-eks
  ref:
    tag: v0.1.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: checkpoint-mcp
  namespace: chkp-mcp
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/checkpoint-mcp
      sourceRef:
        kind: GitRepository
        name: checkpoint-mcp-on-eks
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: checkpoint-mcp-images       # kubectl create configmap ... --from-file=values.yaml=values-images.yaml
    - kind: ConfigMap
      name: checkpoint-mcp-environment  # ... --from-file=values.yaml=values-generated.yaml
  upgrade:
    remediation:
      retries: 3
